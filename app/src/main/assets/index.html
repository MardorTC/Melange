<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#F2E8D6" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Melange</title>
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="melange.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <img class="brand-logo" src="logo.png" alt="" />
        <div>Melange<small>Cada grano cuenta.</small></div>
      </div>
      <button class="icon" data-action="settings" aria-label="Ajustes">
        <svg viewBox="0 0 24 24">
          <path d="M4 7h16M4 17h16M8 4v6M16 14v6" />
        </svg>
      </button>
    </header>
    <main id="view" aria-live="polite"></main>
    <nav id="nav" aria-label="Navegación principal"></nav>
    <dialog id="dialog"><div id="modal"></div></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <input type="file" id="importFile" accept=".json,application/json" hidden />
    <script src="core.js"></script>
    <script src="history-core.js"></script>
    <script src="screens.js"></script>
    <script src="app.js"></script>
  </body>
</html>
